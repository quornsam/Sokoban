<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#efe5d4">
<title>PUSH Sokoban — Bauhaus Edition</title>
<link rel="stylesheet" href="styles.css">
<link rel="preload" as="image" href="assets/board/crate-yellow.png">
<link rel="preload" as="image" href="assets/board/crate-red.png">
<link rel="preload" as="image" href="assets/board/goal-red.png">
<link rel="preload" as="image" href="assets/characters/boy/base.png">
<link rel="preload" as="image" href="assets/characters/girl/base.png">
</head>
<body>
<main class="app">
  <section class="play-area">
    <header class="masthead">
      <div class="title"><strong>PUSH</strong><span>SOKOBAN</span></div>
      <div class="collection"><b>BAUHAUS<br>COLLECTION</b><i></i><span id="levelCount">1 / 50</span></div>
    </header>

    <section class="board-wrap">
      <div id="bgDecor" class="bg-decor" aria-hidden="true"></div>
      <div id="board" class="board" aria-label="Sokoban game board" tabindex="0">
        <div id="voidLayer" class="layer"></div>
        <div id="wallLayer" class="layer"></div>
        <div id="goalLayer" class="layer"></div>
        <div id="pieceLayer" class="layer"></div>
        <div id="celebration" class="celebration" aria-hidden="true"></div>
      </div>
    </section>

    <footer class="instruction"><span class="info">i</span><span>PUSH THE BOXES ONTO THE TARGETS</span></footer>
  </section>

  <aside class="side-panel">
    <section class="credit"><strong id="creditTitle">MICROBAN COLLECTION</strong><span id="creditSub">DAVID W. SKINNER · 50 LEVELS</span></section>

    <section class="stats">
      <div><span>MOVES</span><strong id="moves">0</strong></div>
      <div><span>PUSHES</span><strong id="pushes">0</strong></div>
      <div><span>BEST</span><strong id="best">—</strong></div>
      <div><span>MINIMUM</span><strong id="minimum">—</strong></div>
      <div class="time"><span>TIME</span><strong id="time">00:00</strong></div>
    </section>

    <section class="top-actions">
      <button id="undoBtn" class="action undo"><span>↶</span><b>UNDO</b></button>
      <button id="restartBtn" class="action"><span>↻</span><b>RESTART</b></button>
    </section>

    <section class="dpad" aria-label="Move controls">
      <button data-dir="up">▲</button>
      <button data-dir="left">◀</button>
      <button id="styleBtn" class="centre" type="button" aria-label="Change character style" title="Change character style">
        <svg id="styleOutfitIcon" class="style-outfit-icon" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
          <path class="style-shirt-body" d="M28 13 40 8c2 7 6 10 10 10s8-3 10-10l12 5 13 15-10 10-8-7v27H33V32l-8 7-10-10z"/>
          <path class="style-trousers-body" d="M34 62h32l4 30H54l-4-18-4 18H30z"/>
          <path class="style-icon-seam" d="M50 63v11M33 61h34"/>
        </svg>
      </button>
      <button data-dir="right">▶</button>
      <button data-dir="down">▼</button>
    </section>

    <section class="bottom-actions">
      <button id="soundBtn" class="action small"><span>◖))</span><b>SOUND ON</b></button>
      <button id="musicBtn" class="action small" aria-pressed="true"><span>♫</span><b>MUSIC ON</b></button>
      <button id="levelBtn" class="action small"><span>☰</span><b>LEVEL</b></button>
      <button id="fullscreenBtn" class="action small fullscreen-action"><span>⛶</span><b>FULL SCREEN</b></button>
    </section>

    <section id="levelPicker" class="level-picker" hidden>
      <strong>CHOOSE LEVEL</strong>
      <div id="levelButtons"></div>
    </section>

    <div class="palette" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  </aside>
</main>

<div id="styleModal" class="modal style-modal" hidden>
  <section class="style-card" role="dialog" aria-modal="true" aria-labelledby="styleTitle">
    <button id="styleCloseBtn" class="style-close" type="button" aria-label="Close character style">×</button>
    <div class="style-preview">
      <div class="style-preview-disc">
        <canvas width="600" height="520" data-character-preview="player-front" aria-hidden="true"></canvas>
      </div>
      <div>
        <span class="style-kicker">BAUHAUS WARDROBE</span>
        <h2 id="styleTitle">CHARACTER STYLE</h2>
        <p>Choose character, clothing, skin, hair and shoe colours.</p>
      </div>
    </div>
    <div id="styleControls" class="style-controls"></div>
    <footer class="style-footer">
      <button id="styleResetBtn" class="style-reset" type="button">RESET</button>
      <button id="styleDoneBtn" class="style-done" type="button">DONE</button>
    </footer>
  </section>
</div>

<div id="completeModal" class="modal" hidden>
  <div class="modal-card">
    <span class="modal-mark">✓</span>
    <h2>PUZZLE CLEARED</h2>
    <p id="completeText"></p>
    <button id="nextBtn">NEXT LEVEL</button>
  </div>
</div>

<button id="autoSolveBtn" type="button" hidden tabindex="-1" aria-hidden="true">PLAY SOLUTION</button>
<audio id="bgMusic" src="assets/audio/cracked-ivory-drift.mp3" preload="auto" autoplay loop playsinline></audio>

<script src="levels.js"></script>
<script src="character-styles.js"></script>
<script src="game.js"></script>
</body>
</html>
