<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#efe5d4">
<title>BOXXY Basement</title>
<link rel="icon" href="../assets/ui/icons/boxxy-yellow-crate-v150.ico" sizes="any">
<link rel="stylesheet" href="basement.css?v=329">
</head>
<body>
<main class="basement-shell">
  <header class="basement-head">
    <div>
      <span>BOXXY · PRIVATE ADMIN</span>
      <h1>BASEMENT</h1>
    </div>
    <button id="logoutBtn" type="button" hidden>LOG OUT</button>
  </header>

  <section id="loginPanel" class="login-panel">
    <span class="kicker">PRIVATE ACCESS</span>
    <h2>ADMIN LOGIN</h2>
    <form id="loginForm">
      <label><span>USERNAME</span><input name="username" autocomplete="username" required></label>
      <label><span>PASSWORD</span><input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">ENTER BASEMENT</button>
    </form>
    <p id="loginStatus" class="status" aria-live="polite"></p>
  </section>

  <section id="dashboard" class="dashboard" hidden>
    <div class="dashboard-summary">
      <div><span>ACCOUNT HOLDERS</span><strong id="userCount">0</strong></div>
      <div><span>ACTIVE 24H</span><strong id="activeCount">0</strong></div>
      <div><span>TOTAL TIME ONLINE</span><strong id="totalTime">0m</strong></div>
      <div><span>LEVEL ATTEMPTS</span><strong id="totalAttempts">0</strong></div>
    </div>

    <div class="toolbar">
      <input id="searchInput" type="search" placeholder="Search username, email or IP…" aria-label="Search account holders">
      <button id="refreshBtn" type="button">REFRESH</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>USER</th>
            <th>EMAIL</th>
            <th>JOINED</th>
            <th>LAST ACTIVE</th>
            <th>TOTAL TIME</th>
            <th>ACTIVITY 7D</th>
            <th>GAME STATS</th>
            <th>PROGRESS</th>
            <th>IP</th>
          </tr>
        </thead>
        <tbody id="userRows"></tbody>
      </table>
    </div>
    <div id="userCards" class="user-cards"></div>
    <p id="dashboardStatus" class="status" aria-live="polite"></p>
  </section>
</main>

<div id="detailModal" class="detail-modal" hidden>
  <section class="detail-card" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
    <header>
      <div><span>ACCOUNT DETAIL</span><h2 id="detailTitle">USER</h2></div>
      <button id="detailClose" type="button" aria-label="Close">×</button>
    </header>
    <div id="detailBody" class="detail-body"></div>
  </section>
</div>

<script src="basement.js?v=329"></script>
</body>
</html>
